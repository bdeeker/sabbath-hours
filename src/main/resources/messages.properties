# English (default). Values passed arguments go through java.text.MessageFormat,
# so a literal apostrophe in those values must be written as two ('').
sabbath.summary=Sabbath begins {0} at {1} and ends {2} at {3}.
sabbath.summary.undetermined=Sabbath times cannot be calculated from sunset at this location this week. See the begins and ends fields for the reason.
# java.time.format.DateTimeFormatter patterns (no arguments, so no MessageFormat escaping)
format.day=EEEE, MMMM d
format.time=h:mm a
