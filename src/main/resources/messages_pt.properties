# No "na/no" before the day: the Friday sunset can fall on Saturday's clock (Fairbanks in June), which would change the article's gender.
sabbath.summary=Início do sábado: {0}, às {1}. Término: {2}, às {3}.
sabbath.summary.undetermined=Não é possível calcular o horário do sábado desta semana a partir do pôr do sol neste local. Consulte os campos begins e ends para ver o motivo.
format.day=EEEE, d 'de' MMMM
format.time=HH:mm
