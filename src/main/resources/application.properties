spring.application.name=sabbath-hours

# Errors are RFC 9457 problem details, produced by web/ApiExceptionHandler.
# The API returns JSON only; no view rendering, so no open session during views.
spring.jpa.open-in-view=false

# Never fall back to the server's own locale for a missing translation; fall back to English (messages.properties).
spring.messages.fallback-to-system-locale=false

management.endpoints.web.exposure.include=health,info

# Writes to saved locations need this key in the X-API-Key header. Set it with the
# SABBATH_API_WRITE_KEY environment variable (at least 32 characters). Unset = read-only.
sabbath.api.write-key=${SABBATH_API_WRITE_KEY:}

# Flyway owns the schema; Hibernate only checks that the entities match it.
spring.jpa.hibernate.ddl-auto=validate

# With no datasource configured this runs on an in-memory H2 database (data is lost on restart).
# For PostgreSQL set SPRING_DATASOURCE_URL, SPRING_DATASOURCE_USERNAME, and SPRING_DATASOURCE_PASSWORD.

# The OpenAPI description and Swagger UI are public on purpose: this is an open API meant to be explored.
springdoc.api-docs.enabled=true
springdoc.swagger-ui.enabled=true
