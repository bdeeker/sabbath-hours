spring.application.name=sabbath-hours

# Errors are RFC 9457 problem details, produced by web/ApiExceptionHandler.
# The API returns JSON only; no view rendering, so no open session during views.
spring.jpa.open-in-view=false

# Never fall back to the server's own locale for a missing translation; fall back to English (messages.properties).
spring.messages.fallback-to-system-locale=false

management.endpoints.web.exposure.include=health,info
